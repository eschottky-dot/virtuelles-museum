<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtuelles Museum</title>
  <style>
    /* Dunkles, elegantes Galeriesthema */
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 3rem 1rem;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin: 0;
    }

    header p {
      color: #a0a0a0;
      margin-top: 0.5rem;
    }

    /* Responsive Masonry-Grid ( Pinterest-Style ) */
    .gallery {
      column-count: 3;
      column-gap: 20px;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .gallery { column-count: 2; }
    }

    @media (max-width: 600px) {
      .gallery { column-count: 1; }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .gallery-item img {
      width: 100%;
      display: block;
      height: auto;
    }

    .gallery-item .info {
      padding: 15px;
    }

    .gallery-item .info h3 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
    }

    .gallery-item .info p {
      margin: 0;
      font-size: 0.9rem;
      color: #888;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #666;
      border-top: 1px solid #2a2a2a;
    }
  </style>
</head>
<body>

  <header>
    <h1>VIRTUELLES MUSEUM</h1>
    <p>Eine digitale Sammlung zeitgenössischer Kunst</p>
  </header>

  <main class="gallery">

    <!-- Exponat 1 -->
    <div class="gallery-item">
      <img src="bild1.jpg" alt="Exponat 1">
      <div class="info">
        <h3>Titel des Kunstwerks 1</h3>
        <p>Künstler Name, 2026</p>
      </div>
    </div>

    <!-- Exponat 2 -->
    <div class="gallery-item">
      <img src="bild2.jpg" alt="Exponat 2">
      <div class="info">
        <h3>Titel des Kunstwerks 2</h3>
        <p>Künstler Name, 2025</p>
      </div>
    </div>

    <!-- Exponat 3 -->
    <div class="gallery-item">
      <img src="bild3.jpg" alt="Exponat 3">
      <div class="info">
        <h3>Titel des Kunstwerks 3</h3>
        <p>Künstler Name, 2026</p>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Virtuelles Museum – Alle Rechte vorbehalten.</p>
  </footer>

</body>
</html>
